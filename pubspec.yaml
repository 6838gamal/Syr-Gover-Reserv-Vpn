name: my_vpn
description: Custom WireGuard VPN client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  file_picker: ^8.0.3
  window_manager: ^0.3.9
  tray_manager: ^0.2.3
  launch_at_startup: ^0.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
