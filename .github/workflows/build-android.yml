name: SyrGoverVpn Build & Export Pubspec

on:
  workflow_dispatch:

jobs:
  export-pubspec:
    name: Export Mobile & Desktop pubspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Mobile pubspec
        run: |
          mkdir -p output/mobile
          cp pubspec_mobile.yaml output/mobile/pubspec.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: pubspec-mobile
          path: output/mobile/pubspec.yaml
          retention-days: 30

      - name: Prepare Desktop pubspec
        run: |
          mkdir -p output/desktop
          if [ -f pubspec_desktop.yaml ]; then
            cp pubspec_desktop.yaml output/desktop/pubspec.yaml
          else
            echo "DESKTOP_MISSING=true" >> $GITHUB_ENV
          fi

      - if: env.DESKTOP_MISSING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-desktop
          path: output/desktop/pubspec.yaml
          retention-days: 30

  build-apk:
    name: Build Lightweight Flutter APK
    runs-on: ubuntu-latest
    needs: export-pubspec

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Use Mobile pubspec
        run: cp pubspec_mobile.yaml pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept Android Licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" > /dev/null

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Configure Flutter
        run: |
          flutter config --android-sdk "$ANDROID_SDK_ROOT"
          flutter doctor -v || true

      # 🛠️ إنشاء الملفات الناقصة
      - name: 🛠️ Ensure required Gradle files
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))

          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_ROOT
          EOF

          if [ ! -f android/gradle.properties ]; then
            cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          EOF
          fi

          if [ ! -f android/settings.gradle ]; then
            cat > android/settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.0" apply false
          }
          include ":app"
          EOF
          fi

          if [ ! -f android/build.gradle ]; then
            cat > android/build.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
          subprojects { project.evaluationDependsOn(":app") }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          EOF
          fi

      # 🎨 موارد Android الأساسية
      - name: 🎨 Ensure Android resources exist
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          if [ ! -f android/app/src/main/res/values/styles.xml ]; then
            cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF
          fi

          if [ ! -f android/app/src/main/res/drawable/launch_background.xml ]; then
            cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
          </layer-list>
          EOF
          fi

          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          DEFAULT_ICON="$FLUTTER_ROOT/packages/flutter_tools/templates/app_shared/android.tmpl/res/mipmap-hdpi/ic_launcher.png"
          if [ ! -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            if [ -f "$DEFAULT_ICON" ]; then
              cp "$DEFAULT_ICON" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            else
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            fi
          fi

          for density in mdpi xhdpi xxhdpi xxxhdpi; do
            if [ ! -f android/app/src/main/res/mipmap-$density/ic_launcher.png ]; then
              cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
                 android/app/src/main/res/mipmap-$density/ic_launcher.png 2>/dev/null || true
            fi
          done

      # 🧪 تنزيل Gradle Wrapper 8.3
      - name: 🧪 Download Gradle Wrapper 8.3
        run: |
          cd android
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-all.zip
          EOF
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar" || \
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.3.0/gradle/wrapper/gradle-wrapper.jar"
            curl -fsSL -o gradlew \
              "https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew" || \
            curl -fsSL -o gradlew \
              "https://github.com/gradle/gradle/raw/v8.3.0/gradlew"
            chmod +x gradlew
          fi
          chmod +x gradlew || true
          cd ..
          ls -la android/gradlew

      # 🔥 تحسينات الحجم على build.gradle
      - name: 🔥 Apply size optimizations to build.gradle
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()

          # 1) تفعيل minify + shrinkResources داخل release
          if "minifyEnabled" not in content:
              content = content.replace(
                  "signingConfig = signingConfigs.debug",
                  "signingConfig = signingConfigs.debug\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")"
              )

          # 2) abiFilters داخل defaultConfig
          if "abiFilters" not in content and "ndk {" not in content:
              content = re.sub(
                  r"(defaultConfig\s*\{[^}]*?)(\n\s*\})",
                  r"\1\n        ndk { abiFilters 'arm64-v8a' }\2",
                  content,
                  count=1,
                  flags=re.DOTALL
              )

          with open(path, "w") as f:
              f.write(content)

          print("=== build.gradle after edits ===")
          print(content)
          PY

          # 3) إنشاء proguard-rules.pro إذا لم يكن موجوداً
          if [ ! -f android/app/proguard-rules.pro ]; then
            cat > android/app/proguard-rules.pro <<'EOF'
          -keep class com.wireguard.** { *; }
          -keepclassmembers class com.wireguard.** { *; }
          -dontwarn com.wireguard.**
          -keepclassmembers class kotlinx.coroutines.** { *; }
          -keep class kotlinx.coroutines.** { *; }
          -dontwarn kotlinx.coroutines.**
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -keep class io.flutter.embedding.** { *; }
          -dontwarn io.flutter.**
          -dontwarn org.jetbrains.**
          -dontwarn javax.annotation.**
          -dontwarn kotlin.**
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          EOF
          fi

      - name: Flutter Clean
        run: flutter clean

      - name: Install Dependencies
        run: flutter pub get

      # 🏗️ بناء APK مصغّر (ARM64 فقط)
      - name: Build Lightweight APK (ARM64)
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --tree-shake-icons

      # 🏗️ بناء AAB (للنشر على Google Play)
      - name: Build AAB (ARM64)
        continue-on-error: true
        run: |
          flutter build appbundle \
            --release \
            --target-platform=android-arm64 \
            --tree-shake-icons

      - name: 🔍 Locate outputs
        if: always()
        run: |
          echo "========== APK =========="
          find build -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "no APK"
          echo "========== AAB =========="
          find build -name "*.aab" -exec ls -lh {} \; 2>/dev/null || echo "no AAB"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            android/.gradle/
          retention-days: 7
