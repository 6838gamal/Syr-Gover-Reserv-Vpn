name: SyrGoverVpn Build & Export Pubspec

on:
  workflow_dispatch:

jobs:
  export-pubspec:
    name: Export Mobile & Desktop pubspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Mobile pubspec
        run: |
          mkdir -p output/mobile
          cp pubspec_mobile.yaml output/mobile/pubspec.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: pubspec-mobile
          path: output/mobile/pubspec.yaml
          retention-days: 30

      - name: Prepare Desktop pubspec
        run: |
          mkdir -p output/desktop
          if [ -f pubspec_desktop.yaml ]; then
            cp pubspec_desktop.yaml output/desktop/pubspec.yaml
          else
            echo "DESKTOP_MISSING=true" >> $GITHUB_ENV
          fi

      - if: env.DESKTOP_MISSING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-desktop
          path: output/desktop/pubspec.yaml
          retention-days: 30

  build-apk:
    name: Build Lightweight Flutter APK
    runs-on: ubuntu-latest
    needs: export-pubspec

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Use Mobile pubspec
        run: cp pubspec_mobile.yaml pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept Android Licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" > /dev/null

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Configure Flutter
        run: |
          flutter config --android-sdk "$ANDROID_SDK_ROOT"
          flutter doctor -v || true

      # 12) 🛠️ إنشاء الملفات الناقصة
      - name: 🛠️ Ensure required Gradle files
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))

          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_ROOT
          EOF

          if [ ! -f android/gradle.properties ]; then
            cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          EOF
          fi

          if [ ! -f android/settings.gradle ]; then
            cat > android/settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.0" apply false
          }
          include ":app"
          EOF
          fi

          if [ ! -f android/build.gradle ]; then
            cat > android/build.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
          subprojects { project.evaluationDependsOn(":app") }
          tasks.register("clean", Delete) { delete rootProject.buildDir }
          EOF
          fi

      # 13) 🧪 توليد Gradle Wrapper
      - name: 🧪 Generate Gradle Wrapper
        run: |
          cd android

          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "✅ Wrapper already exists"
          else
            echo "⚠️ Wrapper missing — generating..."

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.3 || \
                gradle wrapper --gradle-version 8.3 --distribution-type all
              echo "✅ generated via system gradle"
            else
              echo "Downloading wrapper from GitHub..."
              mkdir -p gradle/wrapper
              curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
                https://github.com/gradle/gradle/raw/v8.3.0/gradle/wrapper/gradle-wrapper.jar
              curl -fsSL -o gradlew \
                https://github.com/gradle/gradle/raw/v8.3.0/gradlew
              chmod +x gradlew
              echo "✅ downloaded"
            fi
          fi

          chmod +x gradlew || true
          cd ..

          echo "========== WRAPPER CHECK =========="
          ls -la android/gradlew 2>/dev/null || echo "❌ gradlew missing"
          ls -la android/gradle/wrapper/ 2>/dev/null || echo "❌ wrapper missing"
          file android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

      - name: Flutter Clean
        run: flutter clean

      - name: Install Dependencies
        run: flutter pub get

      # 17) بناء APK
      - name: Build Lightweight APK
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --tree-shake-icons

      - name: 🔍 Locate APK
        if: always()
        run: |
          echo "========== APK FILES =========="
          find build -name "*.apk" 2>/dev/null || echo "❌ No APK"
          find build -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            android/.gradle/
          retention-days: 7
