name: SyrGoverVpn Build & Export Pubspec

on:
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: تصدير ملفَي pubspec منفصلين كـ Artifacts
  # ============================================================
  export-pubspec:
    name: Export Mobile & Desktop pubspec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # تصدير نسخة الموبايل
      - name: Prepare Mobile pubspec
        run: |
          mkdir -p output/mobile
          cp pubspec_mobile.yaml output/mobile/pubspec.yaml
          echo "✅ Mobile pubspec ready"

      - name: Upload Mobile pubspec
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-mobile
          path: output/mobile/pubspec.yaml
          retention-days: 30

      # تصدير نسخة المكتبي
      - name: Prepare Desktop pubspec
        run: |
          mkdir -p output/desktop
          cp pubspec_desktop.yaml output/desktop/pubspec.yaml
          echo "✅ Desktop pubspec ready"

      - name: Upload Desktop pubspec
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-desktop
          path: output/desktop/pubspec.yaml
          retention-days: 30

  # ============================================================
  # Job 2: بناء APK خفيف باستخدام pubspec الموبايل
  # ============================================================
  build-apk:
    name: Build Lightweight Flutter APK
    runs-on: ubuntu-latest
    needs: export-pubspec

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      # 1) تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) استبدال pubspec.yaml بنسخة الموبايل
      - name: Use Mobile pubspec
        run: |
          cp pubspec_mobile.yaml pubspec.yaml
          echo "✅ تم استخدام pubspec الموبايل للبناء"

      # 3) إعداد Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4) تشخيص موقع SDK
      - name: Debug - Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la /usr/local/lib/android/sdk || true
          ls -la /usr/local/lib/android/sdk/cmdline-tools || true
          ls -la /usr/local/lib/android/sdk/cmdline-tools/latest/bin || true

      # 5) ضبط PATH
      - name: Configure Android SDK PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH

      # 6) قبول التراخيص
      - name: Accept All Android Licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # 7) تثبيت Android SDK 34
      - name: Install Android SDK 34
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" > /dev/null

      # 8) التحقق من التراخيص
      - name: Verify Licenses
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null | tail -20 || true

      # 9) إعداد Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 10) التحقق من إصدار Flutter
      - name: Check Flutter Version
        run: flutter --version

      # 11) ربط Flutter بـ Android SDK
      - name: Configure Flutter Android SDK
        run: |
          flutter config --android-sdk "$ANDROID_SDK_ROOT"
          flutter doctor -v || true

      # 12) تنظيف المشروع
      - name: Flutter Clean
        run: flutter clean

      # 13) تثبيت الحزم
      - name: Install Dependencies
        run: flutter pub get

      # 14) بناء APK خفيف ARM64
      - name: Build Lightweight APK
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64 \
            --tree-shake-icons

      # 15) رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-release-apk
          path: build/app/outputs/flutter-apk/*.apk
