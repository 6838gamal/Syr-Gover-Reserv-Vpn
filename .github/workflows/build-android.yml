name: SyrGoverVpn Build Lightweight Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # ✅ قبول التراخيص أولاً قبل أي تثبيت — باستخدام printf لضمان الموثوقية
    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    # ✅ تثبيت SDK 34
    - name: Install Android SDK
      run: |
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"
        sdkmanager "platform-tools"

    # ✅ التحقق من قبول التراخيص (للتشخيص)
    - name: Verify Licenses
      run: sdkmanager --licenses < /dev/null | tail -5 || true

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: stable
        cache: true

    - name: Check Flutter Version
      run: flutter --version

    - name: Flutter Clean
      run: flutter clean

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Lightweight APK
      run: |
        flutter build apk \
          --release \
          --target-platform=android-arm64 \
          --tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lightweight-release-apk
        path: build/app/outputs/flutter-apk/*.apk
