name: Build Flutter EXE (Single File)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ تجهيز MSBuild / Visual Studio 2022 قبل أي خطوة بناء
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ✅ تشخيص: عرض مسار Visual Studio المثبت (للتأكد فقط)
      - name: Check Visual Studio installation
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -property installationPath

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'   # أحدث stable مستقر (عدّله حسب مشروعك)
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # ✅ إجبار CMake على استخدام VS2022 بدل VS2019
      - name: Build Windows Release
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: flutter build windows --release

      # ✅ رفع المخرجات الخام (اختياري لكن مفيد للتشخيص)
      - name: Upload raw Windows build
        uses: actions/upload-artifact@v4
        with:
          name: raw-windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 30
          if-no-files-found: warn

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create Installer (Single EXE)
        run: iscc installer.iss

      - name: Upload Single EXE
        uses: actions/upload-artifact@v4
        with:
          name: installer-exe
          path: build/installer/*.exe
          retention-days: 30
          if-no-files-found: error
