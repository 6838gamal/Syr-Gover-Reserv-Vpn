name: Build Flutter EXE (Single File)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 1) التحقق من إصدار Visual Studio
      # ============================================================
      - name: Verify Visual Studio version
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "❌ vswhere.exe not found"; exit 1 }
          $info = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationVersion,installationPath
          $version = ($info | Select-Object -First 1)
          Write-Host "VS version: $version"
          if ($version -match '^18\.') { Write-Error "❌ VS 18 detected, need 17.x"; exit 1 }

      # ============================================================
      # 2) تجهيز MSBuild
      # ============================================================
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ============================================================
      # 3) تجهيز Flutter — مع cache: false (بناء نظيف)
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: false

      # ============================================================
      # 4) flutter clean — قبل أي شيء آخر
      # ============================================================
      - name: Clean Flutter
        run: flutter clean

      # ============================================================
      # 5) pubspec — نسخ pubspec_desktop.yaml
      # ============================================================
      - name: Use pubspec_desktop.yaml as pubspec.yaml
        shell: pwsh
        run: |
          if (-not (Test-Path "pubspec_desktop.yaml")) { Write-Error "pubspec_desktop.yaml not found!"; exit 1 }
          Copy-Item -Path "pubspec_desktop.yaml" -Destination "pubspec.yaml" -Force
          Write-Host "--- pubspec.yaml ---"
          Get-Content pubspec.yaml

      # ============================================================
      # 6) جلب التبعيات
      # ============================================================
      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # ============================================================
      # 7) WINDOWS_KEY.txt من Secret
      # ============================================================
      - name: Write WINDOWS_KEY.txt from secret
        shell: pwsh
        env:
          WINDOWS_KEY: ${{ secrets.WINDOWS_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_KEY)) {
            Write-Warning "⚠️ WINDOWS_KEY secret not set."
            Set-Content -Path "WINDOWS_KEY.txt" -Value "" -NoNewline -Encoding utf8NoBOM
          } else {
            Set-Content -Path "WINDOWS_KEY.txt" -Value $env:WINDOWS_KEY -NoNewline -Encoding utf8NoBOM
            Write-Host "✅ WINDOWS_KEY.txt created."
          }

      # ============================================================
      # 8) التحقق أن manifest ليس في add_executable
      # ============================================================
      - name: Ensure manifest is NOT in add_executable
        shell: pwsh
        run: |
          $cmake = "windows/runner/CMakeLists.txt"
          if (-not (Test-Path $cmake)) { Write-Error "❌ $cmake not found"; exit 1 }
          $content = Get-Content $cmake -Raw
          if ($content -match '"runner\.exe\.manifest"') {
            Write-Error "❌ runner.exe.manifest is still listed in add_executable."
            exit 1
          }
          Write-Host "✅ runner.exe.manifest not in add_executable."

      # ============================================================
      # 9) التحقق من manifest + تحديد mt.exe
      # ============================================================
      - name: Validate manifest source and locate mt.exe
        shell: pwsh
        run: |
          $manifest = "windows/runner/runner.exe.manifest"
          if (-not (Test-Path $manifest)) { Write-Error "❌ $manifest not found"; exit 1 }

          $bytes = [System.IO.File]::ReadAllBytes($manifest)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            Write-Error "❌ BOM detected in manifest"; exit 1
          }
          Write-Host "✅ No BOM detected."

          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          if (-not (Test-Path $sdkRoot)) { Write-Error "❌ Windows Kits bin not found at $sdkRoot"; exit 1 }

          $mt = Get-ChildItem -Path $sdkRoot -Filter mt.exe -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
          if (-not $mt) { Write-Error "❌ mt.exe not found in Windows SDK"; exit 1 }
          Write-Host "Using mt.exe: $($mt.FullName)"

          "MT_EXE=$($mt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "✅ MT_EXE saved to environment."

          & $mt.FullName -manifest $manifest -validate_manifest
          if ($LASTEXITCODE -ne 0) { Write-Error "❌ Manifest validation failed (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "✅ Manifest is valid."

      # ============================================================
      # 10) تنظيف شامل قبل البناء — build + .dart_tool + pubspec.lock + ephemeral
      # ============================================================
      - name: Clean build directory
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path .dart_tool) { Remove-Item -Recurse -Force .dart_tool }
          if (Test-Path pubspec.lock) { Remove-Item -Force pubspec.lock }
          if (Test-Path "windows/flutter/ephemeral") { Remove-Item -Recurse -Force "windows/flutter/ephemeral" }
          Write-Host "✅ build, .dart_tool, pubspec.lock, windows/flutter/ephemeral cleaned."

      # ============================================================
      # 11) إعادة pub get بعد التنظيف
      # ============================================================
      - name: Get dependencies (after clean)
        run: flutter pub get

      # ============================================================
      # 11.4) طباعة الملفات الحرجة للتشخيص
      # ============================================================
      - name: Dump critical Dart files for diagnostics
        shell: pwsh
        run: |
          Write-Host "=== vpn_bridge.dart (abstract class) ==="
          if (Test-Path "lib/services/vpn_bridge.dart") {
            Get-Content "lib/services/vpn_bridge.dart"
          } else {
            Write-Warning "vpn_bridge.dart not found!"
          }
          Write-Host ""
          Write-Host "=== Signatures of all bridge implementations ==="
          Get-ChildItem "lib/services" -Filter "vpn_bridge_*.dart" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host ""
            Write-Host "--- $($_.Name) ---"
            Select-String -Path $_.FullName -Pattern 'class\s+\w+\s+implements\s+VpnBridge|@override|Future<|void\s+\w+\(' |
              ForEach-Object { Write-Host $_.Line }
          }
          Write-Host ""
          Write-Host "=== All imports of vpn_bridge.dart ==="
          Get-ChildItem "lib" -Recurse -Filter "*.dart" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Select-String -Path $_.FullName -Pattern "import\s+.*vpn_bridge\.dart" |
                ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            }

      # ============================================================
      # 11.5) التحقق من تطابق imports
      # ============================================================
      - name: Ensure consistent imports of vpn_bridge.dart
        shell: pwsh
        run: |
          $imports = Get-ChildItem "lib" -Recurse -Filter "*.dart" |
            ForEach-Object {
              Select-String -Path $_.FullName -Pattern "import\s+['""].*vpn_bridge\.dart" |
                ForEach-Object { $_.Line.Trim() }
            } | Sort-Object -Unique

          Write-Host "=== All distinct import forms of vpn_bridge.dart ==="
          $imports | ForEach-Object { Write-Host $_ }

          $hasRelative = $imports | Where-Object { $_ -match "import\s+['""]\.\.?/" }
          $hasPackage  = $imports | Where-Object { $_ -match "import\s+['""]package:" }

          if ($hasRelative -and $hasPackage) {
            Write-Error "❌ MIXED import styles detected! This creates duplicate VpnBridge types."
            Write-Error "   Relative: $($hasRelative -join ' | ')"
            Write-Error "   Package:  $($hasPackage -join ' | ')"
            exit 1
          }
          Write-Host "✅ Import styles are consistent."

      # ============================================================
      # 11.6) dart analyze دقيق على ملفات الجسور
      # ============================================================
      - name: Precise dart analyze on bridge files
        shell: pwsh
        if: always()
        run: |
          $files = @(
            "lib/services/vpn_bridge.dart",
            "lib/services/vpn_bridge_android.dart",
            "lib/services/vpn_bridge_desktop.dart",
            "lib/services/vpn_bridge_stub.dart"
          )
          $failed = $false
          foreach ($f in $files) {
            if (Test-Path $f) {
              Write-Host ""
              Write-Host "=== dart analyze $f ==="
              dart analyze $f
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            } else {
              Write-Warning "Missing file: $f"
            }
          }
          if ($failed) {
            Write-Host "❌ At least one bridge file has analysis errors."
            exit 1
          }
          Write-Host "✅ All bridge files analyze cleanly."

      # ============================================================
      # 11.7) flutter analyze — يفشل مبكرًا بأخطاء واضحة
      # ============================================================
      - name: Static analysis (fail fast with precise errors)
        shell: pwsh
        run: |
          Write-Host "=== flutter analyze (lib only) ==="
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "=================================================="
            Write-Host "❌ STATIC ANALYSIS FAILED — see errors above"
            Write-Host "=================================================="
            Write-Host ""
            Write-Host "Common causes of G76B49859 (missing implementations):"
            Write-Host "  • A method in vpn_bridge.dart has no default body"
            Write-Host "    and is not implemented in one of the bridges."
            Write-Host "  • An import path differs between files"
            Write-Host "    (relative vs package:), creating two VpnBridge types."
            Write-Host "  • A new abstract method was added to VpnBridge"
            Write-Host "    but not yet implemented in all bridges."
            Write-Host ""
            Write-Host "Run locally: flutter analyze lib/services/"
            exit 1
          }
          Write-Host "✅ Static analysis passed."

      # ============================================================
      # 12) بناء Release مع التقاط السجل الكامل
      # ============================================================
      - name: Build Windows Release (capture full log)
        shell: pwsh
        run: |
          $env:CL = ""
          $env:LINK = ""
          $log = "build_windows_full.log"
          flutter build windows --release 2>&1 | Tee-Object -FilePath $log
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            Write-Host ""
            Write-Host "=================================================="
            Write-Host "❌ BUILD FAILED (exit $exit)"
            Write-Host "=================================================="
            Write-Host ""
            Write-Host "=== Extracted Dart compiler errors ==="
            Select-String -Path $log -Pattern 'error\s+[A-Z0-9]+:|\.dart\(\d+,\d+\): error' |
              ForEach-Object { Write-Host $_.Line }
            Write-Host ""
            Write-Host "Full log saved to: $log"
            exit $exit
          }
          Write-Host "✅ Build succeeded."

      # ============================================================
      # 13) تضمين manifest في EXE (post-build)
      # ============================================================
      - name: Embed manifest into EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build\windows\x64\runner\Release" -Filter "*.exe" -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notmatch '^flutter_windows' } |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "❌ No EXE found in build\windows\x64\runner\Release"
            Get-ChildItem "build\windows\x64\runner\Release" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Target EXE: $($exe.FullName)"

          $mt = $env:MT_EXE
          if (-not $mt -or -not (Test-Path $mt)) { Write-Error "❌ MT_EXE not set or file missing: $mt"; exit 1 }
          Write-Host "Using mt.exe: $mt"

          & $mt -manifest "windows\runner\runner.exe.manifest" -outputresource:"$($exe.FullName);#1"
          if ($LASTEXITCODE -ne 0) { Write-Error "❌ mt.exe failed (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "✅ Manifest embedded into EXE."

      # ============================================================
      # 14) التحقق من manifest داخل EXE
      # ============================================================
      - name: Verify manifest in EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build\windows\x64\runner\Release" -Filter "*.exe" -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notmatch '^flutter_windows' } |
                 Select-Object -First 1
          if (-not $exe) { Write-Error "❌ EXE not found"; exit 1 }

          $mt = $env:MT_EXE
          if (-not $mt -or -not (Test-Path $mt)) { Write-Error "❌ MT_EXE not set"; exit 1 }

          & $mt -inputresource:"$($exe.FullName);#1" -out:extracted.manifest
          if ($LASTEXITCODE -ne 0) { Write-Error "❌ Failed to extract manifest (exit $LASTEXITCODE)"; exit 1 }

          Write-Host "--- Extracted manifest from EXE ---"
          Get-Content extracted.manifest -Raw

          if ((Get-Content extracted.manifest -Raw) -notmatch 'requireAdministrator') {
            Write-Error "❌ requireAdministrator NOT found in embedded manifest!"
            exit 1
          }
          Write-Host "✅ requireAdministrator confirmed."

      # ============================================================
      # 15) رفع سجلات عند الفشل
      # ============================================================
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_windows_full.log
            extracted.manifest
            build/windows/x64/**/*.log
            build/windows/x64/**/*.txt
            build/windows/x64/**/*.binlog
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # 16) رفع raw build
      # ============================================================
      - name: Upload raw Windows build
        uses: actions/upload-artifact@v4
        with:
          name: raw-windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 30
          if-no-files-found: warn

      # ============================================================
      # 17) Inno Setup
      # ============================================================
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Prepare installer output dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "build\installer" | Out-Null

      - name: Create Installer (Single EXE)
        shell: pwsh
        run: |
          if (-not (Test-Path "installer.iss")) { Write-Error "❌ installer.iss not found"; exit 1 }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "❌ ISCC.exe not found"; exit 1 }
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "❌ ISCC failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Upload Single EXE
        uses: actions/upload-artifact@v4
        with:
          name: installer-exe
          path: build/installer/*.exe
          retention-days: 30
          if-no-files-found: error
