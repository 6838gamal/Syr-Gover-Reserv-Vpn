name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build web
        run: flutter build web --release --base-href "/Syr-Gover-Reserv-Vpn/"

      - name: Verify build artifacts
        run: |
          echo "=== base href in index.html ==="
          grep -o '<base href="[^"]*"' build/web/index.html || echo "NO BASE TAG FOUND"
          echo ""
          echo "=== files in build/web (root) ==="
          ls -la build/web/
          echo ""
          echo "=== main.dart.js exists? ==="
          ls -la build/web/main.dart.js || echo "main.dart.js MISSING!"
          echo ""
          echo "=== flutter_bootstrap.js exists? ==="
          ls -la build/web/flutter_bootstrap.js || echo "flutter_bootstrap.js MISSING!"
          echo ""
          echo "=== flutter.js exists? ==="
          ls -la build/web/flutter.js || echo "flutter.js MISSING!"
          echo ""
          echo "=== canvaskit folder ==="
          ls -la build/web/canvaskit/ 2>/dev/null | head -20 || echo "canvaskit folder MISSING!"

      - name: Ensure .nojekyll
        run: touch build/web/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
